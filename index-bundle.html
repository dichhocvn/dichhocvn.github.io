<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lá Số Tử Vi Đẩu Số</title>
  <style>
    /* ── CSS Variables (cấu hình) ───────────────────────────── */
    :root {
      --font-family: Arial, sans-serif;
      --fs-chinh: 13px;
      --fs-sao: 11px;
      --fs-header: 11px;
      --fs-footer: 11px;

      --color-chinh: #8b0000;
      --color-cat: #1a5c00;
      --color-hung: #7a2000;
      --color-chi: #4a2e08;
      --color-ten-cung: #4a2e08;
      --color-dai-van: #000;
      --color-truong-sinh: #000;
      --color-bg-cung: #fff;
      --color-bg-page: #fff;
      --color-border: #4a2e08;
      --mono-mode: 0;
    }

    /* ── Reset ──────────────────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background: var(--color-bg-page);
      color: #1a1008;
      min-height: 100vh;
      padding: 16px 16px 16px 8px;
    }

    .page {
      width: 100%;
    }

    /* ── Layout 2 cột khi đủ rộng ───────────────────────────── */
    .main-layout {
      display: flex;
      gap: 0;
      align-items: flex-start;
    }

    .col-chat {
      display: none;
      flex-direction: column;
      width: 340px;
      min-width: 200px;
      max-width: 600px;
      flex-shrink: 0;
      height: calc(100vh - 32px);
      position: sticky;
      top: 16px;
      border: 1px solid #c8b88a;
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
    }

    .col-chat.visible {
      display: flex;
    }

    .col-laso {
      flex: 1;
      min-width: 0;
    }

    /* ── Form area trong col-chat (desktop) ─────────────────── */
    #formArea {
      flex-shrink: 0;
      border-bottom: 1px solid #c8b88a;
      overflow-y: auto;
    }

    /* ── Chế độ mobile (≤768px): ẩn thanh bên trái, chỉ hiện lá số ── */
    /* ── Chế độ desktop (>768px): hiện cả col-chat (trái) + col-laso ── */
    @media (max-width: 768px) {
      .col-chat {
        display: none !important;  /* mobile: ẩn hoàn toàn thanh bên trái */
      }

      .separator {
        display: none !important;  /* mobile: ẩn handle resize */
      }

      .col-laso {
        width: 100% !important;    /* mobile: col-laso chiếm toàn màn hình */
      }
    }

    /* ── Separator (resize handle) ──────────────────────────── */
    .separator {
      width: 6px;
      cursor: col-resize;
      background: #e8dcc8;
      border-radius: 3px;
      flex-shrink: 0;
      align-self: stretch;
      display: none;
      position: relative;
    }

    .separator.visible {
      display: block;
    }

    .separator:hover,
    .separator.dragging {
      background: #c8a870;
    }

    .separator::after {
      content: '⋮';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #a08060;
      font-size: 14px;
    }

    /* ── Chatbot panel ───────────────────────────────────────── */
    .chat-info {
      padding: 10px 12px;
      background: #fffbf2;
      border-bottom: 1px solid #c8b88a;
      font-size: 11px;
      color: #5c3d10;
      flex-shrink: 0;
      max-height: 35%;
      overflow-y: auto;
    }

    .chat-info h4 {
      font-size: 12px;
      font-weight: bold;
      color: #4a2e08;
      margin-bottom: 6px;
    }

    .chat-info-row {
      display: flex;
      gap: 6px;
      margin-bottom: 3px;
    }

    .chat-info-label {
      color: #7a5c2a;
      min-width: 70px;
    }

    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .chat-apikey {
      padding: 6px 8px;
      border-bottom: 1px solid #eee;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }

    .chat-apikey input {
      flex: 1;
      font-size: 11px;
      padding: 4px 6px;
      border: 1px solid #c8b88a;
      border-radius: 3px;
      font-family: monospace;
    }

    .chat-apikey label {
      font-size: 10px;
      color: #7a5c2a;
      white-space: nowrap;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }

    .chat-msg {
      max-width: 90%;
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .chat-msg.user {
      align-self: flex-end;
      background: #8b5e1a;
      color: #fff;
      border-bottom-right-radius: 3px;
    }

    .chat-msg.assistant {
      align-self: flex-start;
      background: #f5f0e8;
      color: #1a1008;
      border-bottom-left-radius: 3px;
    }

    .chat-msg.thinking {
      align-self: flex-start;
      background: #f0f0f0;
      color: #888;
      font-style: italic;
    }

    .chat-input-row {
      display: flex;
      gap: 6px;
      padding: 8px;
      border-top: 1px solid #e8dcc8;
      flex-shrink: 0;
    }

    .chat-input-row textarea {
      flex: 1;
      resize: none;
      height: 60px;
      font-size: 12px;
      font-family: inherit;
      padding: 6px 8px;
      border: 1px solid #c8b88a;
      border-radius: 4px;
      outline: none;
    }

    .chat-input-row textarea:focus {
      border-color: #8b5e1a;
    }

    .chat-send {
      padding: 0 12px;
      background: #8b5e1a;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      align-self: stretch;
    }

    .chat-send:hover {
      background: #6b4810;
    }

    .chat-send:disabled {
      background: #ccc;
      cursor: default;
    }

    /* ── Form ───────────────────────────────────────────────── */
    .form-wrap {
      background: #fff;
      border: 1px solid #c8b88a;
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      align-items: end;
    }

    .fg label {
      display: block;
      font-size: 10px;
      font-weight: bold;
      color: #7a5c2a;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 3px;
    }

    .fg input,
    .fg select {
      width: 100%;
      padding: 5px 7px;
      border: 1px solid #c8b88a;
      border-radius: 3px;
      font-size: 12px;
      font-family: inherit;
      background: #fdfaf4;
      color: #1a1008;
    }

    .fg input:focus,
    .fg select:focus {
      outline: none;
      border-color: #8b5e1a;
    }

    .btn {
      width: 100%;
      padding: 7px;
      border: 1px solid #8b5e1a;
      background: #8b5e1a;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: bold;
      border-radius: 3px;
      cursor: pointer;
    }

    .btn:hover {
      background: #6b4810;
    }

    .err {
      color: #c0392b;
      font-size: 12px;
      margin-top: 4px;
      display: none;
    }

    /* ── Canh giờ info ──────────────────────────────────────── */
    .canh-info {
      background: #fffbf2;
      border: 1px solid #c8b88a;
      border-radius: 4px;
      padding: 7px 12px;
      margin-bottom: 10px;
      font-size: 12px;
      color: #5c3d10;
      display: none;
    }

    .canh-info b {
      color: #8b5e1a;
    }

    /* ── Lá số wrapper ──────────────────────────────────────── */
    .laso-wrap {
      display: none;
      text-align: center;
      padding-top: 10px;
    }

    /* Wrapper để scale lá số responsive */
    /* Wrapper responsive */
    .grid-scaler-outer {
      width: 100%;
      overflow: hidden;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      padding: 0 5px;
    }

    .grid-scaler {
      display: block;
      transform-origin: top left;
    }

    .ls-title {
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      color: #4a2e08;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    /* ── Tab bar hiện đại ───────────────────────────────────── */
    .tab-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
      background: #f0f0f0;
      border-radius: 8px;
      padding: 4px;
      font-family: Arial, sans-serif;
    }

    .tab-btn {
      flex: 1;
      padding: 7px 10px;
      font-size: 12px;
      font-family: Arial, sans-serif;
      font-weight: 500;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #555;
      cursor: pointer;
      transition: background .15s, color .15s, box-shadow .15s;
    }

    .tab-btn:hover {
      background: #e0e0e0;
      color: #222;
    }

    .tab-btn.tab-active {
      background: #fff;
      color: #1a1008;
      font-weight: 600;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .15);
    }

    /* 4.3cm × 4 col = 17.2cm rộng, 5.7cm × 4 row = 22.8cm cao */
    .grid {
      display: inline-grid;
      grid-template-columns: repeat(4, 4.3cm);
      grid-template-rows: repeat(4, minmax(5.7cm, auto));
      width: fit-content;
      border: 2px solid var(--color-border);
      background: var(--color-border);
      gap: 1px;
      position: relative;
    }

    /* ── Ô cung — flex dọc 3 vùng ──────────────────────────── */
    .cung {
      background: var(--color-bg-cung);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      width: 4.3cm;
      min-height: 5.7cm;
    }

    /* Nén text dọc 85% cho toàn bộ nội dung trong cung */
    .cung-top,
    .cung-mid,
    .cung-bot {}

    .cung.menh {
      background: var(--color-bg-cung);
    }

    .cung.than {
      background: var(--color-bg-cung);
    }

    /* ── ScaleY text trong cung ───────────────────────────────── */

    /* ── TOP: header — 12px ─────────────────────────────────── */
    .cung-top {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 0;
      padding: 10px 3px 4px;
      flex-shrink: 0;
      background: var(--color-bg-cung);
    }

    .top-chi {
      font-size: var(--fs-header);
      font-weight: bold;
      color: var(--color-chi);
      width: 30%;
      flex-shrink: 0;
      text-align: left;
      overflow: hidden;
    }

    .top-ten {
      font-size: var(--fs-header);
      color: var(--color-ten-cung);
      font-weight: bold;
      width: 40%;
      flex-shrink: 0;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      letter-spacing: .3px;
    }

    .top-dh {
      font-family: Arial, sans-serif;
      font-size: var(--fs-header);
      color: var(--color-dai-van);
      font-weight: bold;
      white-space: nowrap;
      text-align: right;
      width: 30%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
      position: relative;
    }

    .top-thang {
      position: absolute;
      top: 100%;
      right: 0;
      z-index: 2;
      white-space: nowrap;
    }

    .top-thang-inner {
      display: inline-block;
      background: none;
      color: #000;
      border-radius: 3px;
      padding: 1px 3px;
      font-size: calc(var(--fs-header) - 1px);
      line-height: 1.3;
      font-weight: bold;
    }

    /* Badge mệnh/thân */
    .badge {
      display: inline-block;
      font-size: 7px;
      font-weight: bold;
      padding: 0 3px;
      border-radius: 2px;
      line-height: 13px;
      vertical-align: middle;
      margin-left: 3px;
    }

    .badge-m {
      background: #c8960a;
      color: #fff;
    }

    .badge-t {
      background: #2980b9;
      color: #fff;
    }

    /* ── MIDDLE: chính tinh (2 hàng) + cát/hung (2 cột) ────── */
    .cung-mid {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 2px 3px;
    }

    /* Khu chính tinh — 2 hàng cố định 20px, căn giữa */
    .mid-chinh {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .mid-cathung-wrap {
      margin-top: 5px;
    }

    .chinh-row {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 0.8em;
    }

    .chinh-empty {
      display: block;
      width: 100%;
      min-height: 0.8em;
    }

    /* Khu cát/hung — 2 cột song song, gap 10px */
    .mid-cathung {
      flex: 1;
      display: flex;
      gap: 10px;
      overflow: hidden;
      min-height: 0;
      margin-top: 2px;
    }

    .col-cat {
      flex: 1;
      min-width: 0;
    }

    .col-hung {
      flex: 1;
      min-width: 0;
    }

    /* ── Sao ────────────────────────────────────────────────── */
    .sao-chinh {
      font-family: var(--font-family);
      font-size: var(--fs-chinh);
      font-weight: bold;
      color: var(--color-chinh);
      display: block;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: .3px;
    }

    .sao-cat {
      font-size: var(--fs-sao);
      color: var(--color-cat);
      display: block;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-align: left;
    }

    .sao-cat.bold {
      font-weight: bold;
    }

    .sao-hung {
      font-size: var(--fs-sao);
      color: var(--color-hung);
      display: block;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-align: left;
    }

    .sao-hung.bold {
      font-weight: bold;
    }

    .sao-trung {
      font-size: var(--fs-sao);
      color: #4a3010;
      display: block;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-align: left;
    }

    /* Fix: sup tag bên trong gradient text cần reset fill color */
    .sao-chinh sup,
    .sao-cat sup,
    .sao-hung sup {
      -webkit-text-fill-color: initial;
      background: none;
    }

    /* sucManh inline — cùng font-size với sao, cùng hàng */
    .sm-inline {
      font-size: inherit;
      margin-left: 1px;
    }



    /* ── BOTTOM: footer — 12px ──────────────────────────────── */
    .cung-bot {
      display: flex;
      align-items: flex-end;
      padding: 4px 3px 10px;
      flex-shrink: 0;
      background: var(--color-bg-cung);
    }

    /* Vị trí 7 (trái): 30% căn trái */
    .bot-dv {
      width: 100%;
      flex-shrink: 0;
      text-align: left;
      font-size: var(--fs-footer);
      font-weight: bold;
    }

    .bot-dv-inner {
      display: inline-block;
      background: #1565c0;
      color: #fff;
      border-radius: 3px;
      padding: 1px 3px;
      font-size: calc(var(--fs-footer) - 1px);
      line-height: 1.3;
    }

    .bot-left-col {
      width: 30%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-end;
      gap: 1px;
    }

    .bot-ln {
      width: 100%;
      text-align: right;
      font-size: calc(var(--fs-footer) - 1px);
    }

    .bot-ln-inner {
      display: inline-block;
      background: #6a1b9a;
      color: #fff;
      border-radius: 3px;
      padding: 1px 3px;
      line-height: 1.3;
    }

    /* Vị trí 8 (giữa): 60% căn giữa */
    .bot-ts {
      flex: 1;
      text-align: center;
      font-size: var(--fs-footer);
      color: var(--color-truong-sinh);
      font-weight: bold;
      overflow: hidden;
    }

    /* Sao lưu đại vận */
    .sao-dv-luu {
      font-size: var(--fs-sao);
      color: #1565c0;
      font-weight: bold;
      display: block;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
    }

    /* Vị trí 9 (phải): 30% căn phải */
    .bot-dh {
      width: 30%;
      flex-shrink: 0;
      text-align: right;
      font-size: var(--fs-footer);
      color: var(--color-dai-van);
      font-weight: bold;
    }

    .bot-right-col {
      width: 30%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 1px;
    }

    .bot-ln {
      text-align: right;
    }

    .bot-ln-inner {
      display: inline-block;
      background: #6a1b9a;
      color: #fff;
      border-radius: 3px;
      padding: 1px 3px;
      font-size: calc(var(--fs-footer) - 1px);
      line-height: 1.3;
      font-weight: bold;
    }

    .bot-thang {
      display: none;
    }

    /* ── Highlight khi click ─────────────────────────────────── */
    .cung {
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }

    .cung.hl-selected,
    .cung.hl-doi,
    .cung.hl-tamhop {
      background: #f0f0f0;
      border-color: #999;
    }

    .cung.hl-selected .cung-top,
    .cung.hl-doi .cung-top,
    .cung.hl-tamhop .cung-top,
    .cung.hl-selected .cung-bot,
    .cung.hl-doi .cung-bot,
    .cung.hl-tamhop .cung-bot {
      background: #f0f0f0;
    }

    .center {
      background: var(--color-bg-cung);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 8px;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    .center-bg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 0;
    }

    .center-bg svg {
      width: 88%;
      height: 88%;
      opacity: 0.10;
    }

    .center>*:not(.center-bg) {
      position: relative;
      z-index: 1;
    }

    .c-name {
      font-size: 13px;
      font-weight: bold;
      color: #4a2e08;
      margin-bottom: 4px;
    }

    .c-hr {
      width: 70%;
      border: none;
      border-top: 1px solid #c8b88a;
      margin: 3px auto;
    }

    .c-table {
      font-size: 13px;
      color: #1a1008;
      border-collapse: collapse;
      width: 100%;
    }

    .c-table td {
      padding: 1px 3px;
    }

    .c-lbl {
      color: #7a5c2a;
      text-align: right;
      white-space: nowrap;
    }

    .c-cuc {
      font-size: 13px;
      font-weight: bold;
      color: #8b0000;
      margin: 4px 0;
    }

    /* ── Legend ─────────────────────────────────────────────── */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      font-size: 10px;
      margin-top: 8px;
      color: #5c3d10;
    }

    .leg {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .leg-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    /* ── Pill Triệt ─────────────────────────────────────────── */
    .triet-pill {
      position: absolute;
      background: #1a1008;
      color: #fff;
      font-size: 10px;
      font-weight: bold;

      white-space: nowrap;
      border-radius: 3px;
      z-index: 10;
      pointer-events: none;
      padding: 2px 8px;
      transform: translate(-50%, -65%);
    }

    .tuan-pill {
      position: absolute;
      background: #1a1008;
      color: #fff;
      font-size: 10px;
      font-weight: bold;

      white-space: nowrap;
      border-radius: 3px;
      z-index: 10;
      pointer-events: none;
      padding: 2px 8px;
      transform: translate(-50%, -65%);
    }

    .tuantriet-pill {
      position: absolute;
      background: #1a1008;
      color: #fff;
      font-size: 10px;
      font-weight: bold;

      white-space: nowrap;
      border-radius: 3px;
      z-index: 10;
      pointer-events: none;
      padding: 2px 8px;
      transform: translate(-50%, -65%);
    }

    .luu-triet-pill {
      position: absolute;
      background: #1a1008;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      white-space: nowrap;
      border-radius: 3px;
      z-index: 10;
      pointer-events: none;
      padding: 2px 8px;
      transform: translate(-50%, -65%);
    }

    .luu-tuan-pill {
      position: absolute;
      background: #1a1008;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      white-space: nowrap;
      border-radius: 3px;
      z-index: 10;
      pointer-events: none;
      padding: 2px 8px;
      transform: translate(-50%, -65%);
    }


    /* ── Nút xuất prompt ──────────────────────────────────────── */
    .btn-prompt {
      margin-top: 8px;
      margin-left: 6px;
      padding: 5px 12px;
      background: transparent;
      border: 1px solid #2980b9;
      color: #2980b9;
      font-family: inherit;
      font-size: 11px;
      border-radius: 3px;
      cursor: pointer;
    }

    .btn-prompt:hover {
      background: #eaf4fb;
    }

    /* ── Prompt Export Modal ──────────────────────────────────── */
    .prompt-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .prompt-overlay.open {
      display: flex;
    }

    .prompt-modal {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.25);
      /* desktop: ~2/3 màn hình */
      width: 66vw;
      height: 66vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* mobile: gần full màn hình */
    @media (max-width: 768px) {
      .prompt-modal {
        width: 95vw;
        height: 92vh;
        border-radius: 8px;
      }
    }

    .prompt-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px 10px;
      border-bottom: 1px solid #e0d4c0;
      background: #fffbf2;
      flex-shrink: 0;
    }

    .prompt-modal-header h3 {
      font-size: 14px;
      font-weight: bold;
      color: #4a2e08;
      margin: 0;
    }

    .prompt-modal-close {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #888;
      line-height: 1;
      padding: 0 4px;
    }

    .prompt-modal-close:hover { color: #333; }

    .rule-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 4000;
      padding: 16px;
    }

    .rule-overlay.open { display: flex; }

    .rule-modal {
      width: min(900px, 96vw);
      max-height: 86vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #fffdf7;
      border-radius: 10px;
      border: 1px solid #d6c6a2;
      box-shadow: 0 14px 44px rgba(0, 0, 0, .25);
    }

    .rule-modal-header {
      padding: 10px 14px;
      border-bottom: 1px solid #e6d8b8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .rule-modal-title {
      font-weight: 700;
      font-size: 14px;
      color: #4a2e08;
    }

    .rule-modal-close {
      border: none;
      background: transparent;
      font-size: 20px;
      line-height: 1;
      color: #8b6b35;
      cursor: pointer;
    }

    .rule-modal-close:hover { color: #4a2e08; }

    .rule-modal-body {
      padding: 12px 14px 14px;
      overflow: auto;
      font-size: 12px;
      line-height: 1.55;
      color: #2b1d0c;
    }

    .rule-hit {
      border: 1px solid #e6d8b8;
      border-radius: 8px;
      padding: 10px;
      background: #fff;
      margin-bottom: 10px;
    }

    .rule-hit-rule {
      font-family: Consolas, Monaco, monospace;
      font-size: 11px;
      color: #6e4d1a;
      background: #fffaef;
      border: 1px dashed #ddc28b;
      border-radius: 6px;
      padding: 6px 8px;
      margin-top: 6px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .prompt-tabs {
      display: flex;
      gap: 4px;
      padding: 10px 18px 0;
      border-bottom: 1px solid #e0d4c0;
      flex-shrink: 0;
      background: #faf7f2;
    }

    .prompt-tab {
      padding: 6px 16px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid #c8b88a;
      border-bottom: none;
      border-radius: 5px 5px 0 0;
      background: #f0e8d8;
      color: #7a5c2a;
      cursor: pointer;
      position: relative;
      top: 1px;
    }

    .prompt-tab.active {
      background: #fff;
      color: #4a2e08;
      border-color: #c8b88a;
    }

    .prompt-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 14px 18px;
      gap: 10px;
      overflow: hidden;
    }

    .prompt-output {
      flex: 1;
      min-height: 0;
      width: 100%;
      font-family: 'Courier New', monospace;
      font-size: 11.5px;
      line-height: 1.6;
      border: 1px solid #c8b88a;
      border-radius: 5px;
      padding: 10px 12px;
      resize: none;
      background: #fafafa;
      color: #1a1008;
      box-sizing: border-box;
    }

    .prompt-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .prompt-copy-btn {
      padding: 7px 18px;
      background: #2980b9;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .prompt-copy-btn:hover { background: #1a5e8a; }

    .prompt-copy-btn.copied {
      background: #27ae60;
    }

    /* ── Prompt options (chỉ hiện ở tab text) ── */
    .prompt-options {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      padding: 8px 18px 10px;
      background: #faf7f2;
      border-bottom: 1px solid #e0d4c0;
      flex-shrink: 0;
    }

    .prompt-options.hidden { display: none; }

    .prompt-opt-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .prompt-opt-group label.group-label {
      font-size: 10px;
      font-weight: bold;
      color: #7a5c2a;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 2px;
    }

    .prompt-opt-group label.radio-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #4a2e08;
      cursor: pointer;
    }

    .prompt-dl-btn {
      padding: 7px 18px;
      background: transparent;
      color: #4a2e08;
      border: 1px solid #c8b88a;
      border-radius: 5px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .prompt-dl-btn:hover { background: #f0e8d0; }

    .btn-save {
      margin-top: 8px;
      margin-left: 6px;
      padding: 5px 12px;
      background: #2d6a2d;
      border: 1px solid #2d6a2d;
      color: #fff;
      font-family: inherit;
      font-size: 11px;
      border-radius: 3px;
      cursor: pointer;
    }

    .btn-save:hover {
      background: #1a4a1a;
    }
  </style>
</head>

<body data-layout="desktop">
  <div class="page">
    <div class="main-layout" id="mainLayout">

      <!-- Thanh bên trái: chỉ hiện ở chế độ desktop -->

              đặt câu hỏi nhé.</div>

            </div>
            <div class="fg al-field"><label>Tháng ÂL</label>
              <input id="thang" type="number" min="1" max="12" value="9">

        BANG_TU_VI, VONG_TU_VI, THIEN_PHU, VONG_THIEN_PHU,
        TU_HOA,
        SUC_MANH_LABEL,
        TRUONG_SINH_KHOI, TRUONG_SINH_TEN,
        SAO_META,
        SAO_HANH,
        SAO_THEO_CAN, TRIET, TUAN,
        SAO_THEO_NAM,
        SAO_THEO_THANG,
        SAO_THEO_GIO,
        HOA_TINH_KHOI, LINH_TINH_KHOI,
      };
    })();

    // ============================================================
    // logic.js — Tính toán Tử Vi Đẩu Số, xuất JSON chuẩn
    // Phụ thuộc: data.js (TUVI_DATA phải load trước)
    // ============================================================

    const TUVI_LOGIC = (() => {
      const D = TUVI_DATA;  // alias ngắn

      // Lấy hành đơn (ưu tiên hành đầu nếu kép): 'moc-thuy' → 'moc'
      function hanhDon(hanh) { return hanh ? hanh.split('-')[0] : ''; }

      // ── Helpers ──────────────────────────────────────────────

      function chiGioFromStr(hhmm) {
        const parts = hhmm.split(':');
        const h = parseInt(parts[0]);
        const m = parts.length > 1 ? parseInt(parts[1]) : 0;
        if (isNaN(h) || h < 0 || h > 23) return null;
        return Math.floor(((h + 1) % 24) / 2);
      }

      // ── Tính vị trí các sao ──────────────────────────────────

      function tinhViTriSao(canNam, chiNam, chiGio, thang, ngay, soCuc, chiTV, thuanChieu, chiCungMenh, chiCungThan) {

        // ── Chính tinh: tra bảng b4/b5/b6/b7 ───────────────────
        const chiTF = D.THIEN_PHU[chiTV];
        const chinh = {
          'Tử Vi': chiTV,
          'Thiên Cơ': D.VONG_TU_VI['Thiên Cơ'][chiTV],
          'Thái Dương': D.VONG_TU_VI['Thái Dương'][chiTV],
          'Vũ Khúc': D.VONG_TU_VI['Vũ Khúc'][chiTV],
          'Thiên Đồng': D.VONG_TU_VI['Thiên Đồng'][chiTV],
          'Liêm Trinh': D.VONG_TU_VI['Liêm Trinh'][chiTV],
          'Thiên Phủ': chiTF,
          'Thái Âm': D.VONG_THIEN_PHU['Thái Âm'][chiTF],
          'Tham Lang': D.VONG_THIEN_PHU['Tham Lang'][chiTF],
          'Cự Môn': D.VONG_THIEN_PHU['Cự Môn'][chiTF],
          'Thiên Tướng': D.VONG_THIEN_PHU['Thiên Tướng'][chiTF],
          'Thiên Lương': D.VONG_THIEN_PHU['Thiên Lương'][chiTF],
          'Thất Sát': D.VONG_THIEN_PHU['Thất Sát'][chiTF],
          'Phá Quân': D.VONG_THIEN_PHU['Phá Quân'][chiTF],
        };

        // ── Phụ tinh theo CAN năm ────────────────────────────────
        const phu_can = {};
        Object.entries(D.SAO_THEO_CAN).forEach(([ten, arr]) => {
          phu_can[ten] = arr[canNam];
        });

        // ── Phụ tinh theo CHI năm ────────────────────────────────
        const phu_nam = {};
        Object.entries(D.SAO_THEO_NAM).forEach(([ten, arr]) => {
          phu_nam[ten] = arr[chiNam];
        });

        // ── Hỏa Tinh, Linh Tinh (chi năm + chi giờ) ─────────────
        const phu_hoa = {
          'Hỏa Tinh': (D.HOA_TINH_KHOI[chiNam] + chiGio - 1 + 12) % 12,
          'Linh Tinh': (D.LINH_TINH_KHOI[chiNam] - chiGio + 1 + 12) % 12,
        };

        // ── Phụ tinh theo THÁNG ──────────────────────────────────
        const phu_thang = {};
        Object.entries(D.SAO_THEO_THANG).forEach(([ten, arr]) => {
          phu_thang[ten] = arr[thang - 1];
        });

        // ── Phụ tinh theo GIỜ ────────────────────────────────────
        const phu_gio = {};
        Object.entries(D.SAO_THEO_GIO).forEach(([ten, arr]) => {
          phu_gio[ten] = arr[chiGio];
        });

        // ── Ân Quang & Thiên Quý (giờ + ngày) ───────────────────
        // Ân Quang: khởi tại Văn Xương, thuận ngày-1 bước, rồi lùi 1 → (chiVX + ngay - 2 + 12) % 12
        // Thiên Quý: khởi tại Văn Khúc, ngược ngày-1 bước, rồi tiến 1 → (chiVK - ngay + 2 + 12) % 12
        const chiVX = D.SAO_THEO_GIO['Văn Xương'][chiGio];
        const chiVK = D.SAO_THEO_GIO['Văn Khúc'][chiGio];
        const phu_gio_ngay = {
          'Ân Quang': (chiVX + ngay - 2 + 12) % 12,
          'Thiên Quý': ((chiVK - ngay + 2) % 12 + 12) % 12,
        };

        // ── Tam Thai & Bát Tọa (tháng + ngày) ───────────────────
        // Tam Thai : tháng 1 tại Thìn(4), thuận tới tháng sinh = Tả Phụ
        //            rồi thuận ngày-1 bước → (chiTP + ngay - 1) % 12
        // Bát Tọa  : tháng 1 tại Tuất(10), ngược tới tháng sinh = Hữu Bật
        //            rồi ngược ngày-1 bước → (chiHB - ngay + 1 + 12) % 12
        const chiTP = D.SAO_THEO_THANG['Tả Phụ'][thang - 1];
        const chiHB = D.SAO_THEO_THANG['Hữu Bật'][thang - 1];
        const phu_thang_ngay = {
          'Tam Thai': (chiTP + ngay - 1) % 12,
          'Bát Tọa': ((chiHB - ngay + 1) % 12 + 12) % 12,
        };

        // ── Vòng Bác Sĩ (12 sao, khởi tại Lộc Tồn) ─────────────
        // Thuận/nghịch giống chiều đại hạn (thuanChieu)
        const VONG_BAC_SI = [
          'Bác Sĩ', 'Lực Sĩ', 'Thanh Long', 'Tiểu Hao',
          'Tướng Quân', 'Tấu Thư', 'Phi Liêm', 'Hỉ Thần',
          'Bệnh Phù', 'Đại Hao', 'Phục Binh', 'Quan Phủ',
        ];
        const chiLocTon = D.SAO_THEO_CAN['Lộc Tồn'][canNam];
        const phu_bac_si = {};
        VONG_BAC_SI.forEach((ten, i) => {
          phu_bac_si[ten] = thuanChieu
            ? (chiLocTon + i) % 12
            : (chiLocTon - i + 12) % 12;
        });

        // ── Vòng Thái Tuế (12 sao, khởi chi năm, luôn thuận) ────
        const VONG_THAI_TUE = [
          'Thái Tuế', 'Thiếu Dương', 'Tang Môn', 'Thiếu Âm',
          'Quan Phù', 'Tử Phù', 'Tuế Phá', 'Long Đức',
          'Bạch Hổ', 'Phúc Đức', 'Điếu Khách', 'Trực Phù',
        ];
        const phu_thai_tue = {};
        VONG_THAI_TUE.forEach((ten, i) => {
          phu_thai_tue[ten] = (chiNam + i) % 12;
        });

        // ── Thiên Tài & Thiên Thọ (Mệnh/Thân + chi năm) ─────────
        // Tại cung Mệnh/Thân đặt Tý, chạy thuận tới chi năm
        const phu_tai_tho = {
          'Thiên Tài': (chiCungMenh + chiNam) % 12,
          'Thiên Thọ': (chiCungThan + chiNam) % 12,
        };

        // ── Đẩu Quân: Thái Tuế (chiNam) → ngược (thang-1) bước → thuận chiGio bước ──
        const chiDauQuan = ((chiNam - (thang - 1) + 12) % 12 + chiGio) % 12;
        const phu_dau_quan = { 'Đẩu Quân': chiDauQuan };

        return Object.assign({}, chinh, phu_can, phu_nam, phu_hoa, phu_thang, phu_gio, phu_gio_ngay, phu_thang_ngay, phu_bac_si, phu_thai_tue, phu_tai_tho, phu_dau_quan);
      }

      // ── Xuất JSON chuẩn ──────────────────────────────────────
      // Vị trí trong một cung (position):
      //   1 = địa chi (góc trái header)
      //   2 = tên cung chức (giữa header)
      //   3 = đại vận tuổi (góc phải header)
      //   4 = chính tinh (khu giữa, 2 hàng)
      //   5 = cát tinh / trung tính (cột trái khu giữa)
      //   6 = hung tinh (cột phải khu giữa)
      //   7 = vòng trường sinh (góc trái footer)
      //   8 = tháng (giữa footer)
      //   9 = đại vận số (góc phải footer)
      //
      // Schema một sao trong JSON:
      // {
      //   name:     string,   // tên sao
      //   type:     string,   // 'chinh' | 'cat' | 'hung' | 'trung'  (vị trí: chinh→pos4, cat→pos5, hung→pos6)
      //   sucManh:  string,   // 'M' | 'V' | 'B' | 'H' | ''
      //   hoaKy:    string | null,
      //   nguHanh:  string,   // 'kim'|'moc'|'thuy'|'hoa'|'tho'|''
      // }
      //
      // Schema một cung:
      // {
      //   cungChuc:   string,   // 'Mệnh' | 'Phụ Mẫu' | ...   (pos2; index infer từ cungChuc)
      //   diaChi:     string,   // 'Tý' | 'Sửu' | ...          (pos1; chiIndex infer từ diaChi)
      //   gridRow:    number,   // 1..4
      //   gridCol:    number,   // 1..4
      //   isThan:     boolean,
      //   daiVan:     number|null,  // tuổi bắt đầu đại hạn    (pos3/pos9)
      //   truongSinh: string,       // vòng trường sinh         (pos7)
      //   sao:        Star[],
      // }
      //   meta: { hoTen, ngayAL, thangAL, namAL, gioSinh, gioiTinh,
      //           canNam, chiNam, tenChiGio,
      //           chiCungMenh, chiCungThan, canCungMenh,
      //           tenCuc, thuanChieu, napAm,
      //           viTriTriet, viTriTuan },
      //   cung: Cung[12],   // thứ tự 0=Mệnh..11=Huynh Đệ, infer từ cungChuc/diaChi
      // }

      function compute({ hoTen, ngay, thang, nam, gioSinh, gioiTinh }) {
        // Validate
        const chiGio = chiGioFromStr(gioSinh);
        if (chiGio === null) throw new Error('Giờ sinh không hợp lệ');
        if (ngay < 1 || ngay > 30) throw new Error('Ngày âm lịch phải từ 1 đến 30');
        if (thang < 1 || thang > 12) throw new Error('Tháng phải từ 1 đến 12');

        // Can Chi năm
        const canNam = ((nam - 4) % 10 + 10) % 10;
        const chiNam = ((nam - 4) % 12 + 12) % 12;

        // Cung Mệnh & Thân (tra bảng)
        const chiCungMenh = D.BANG_MENH[chiGio][thang - 1];
        const chiCungThan = D.BANG_THAN[chiGio][thang - 1];

        // Ngũ Hành Cục — 2 bước:
        // 1. Tra thiên can cung Mệnh theo (canNam × chiCungMenh)
        const canCungMenh = D.BANG_THIENCAN_CUNGMENH[canNam][chiCungMenh];
        // 2. Tra cục theo (canCungMenh × chiCungMenh)
        const soCuc = D.BANG_CUC_MENH[canCungMenh][chiCungMenh];

        // Vị trí Tử Vi
        const chiTV = D.BANG_TU_VI[soCuc][ngay - 1];

        // Đại hạn (chiều đi) — tính trước để truyền vào tinhViTriSao (cần cho vòng Bác Sĩ)
        const namDuong = canNam % 2 === 0;
        const thuanChieu = (gioiTinh === 'nam') ? namDuong : !namDuong;

        // Vị trí tất cả sao
        const viTriSao = tinhViTriSao(canNam, chiNam, chiGio, thang, ngay, soCuc, chiTV, thuanChieu, chiCungMenh, chiCungThan);

        // Tứ Hóa: sao nào được hóa → vị trí chi của sao đó
        // Hóa Lộc/Quyền/Khoa an tại cung chứa sao được hóa, như sao cát độc lập
        // Hóa Kỵ an tại cung chứa sao được hóa, như sao hung độc lập
        const HOA_TEN = ['Hóa Lộc', 'Hóa Quyền', 'Hóa Khoa', 'Hóa Kỵ'];
        const hoaViTri = {}; // 'Hóa Lộc' → chi cung
        D.TU_HOA[canNam].forEach((tenSaoHoa, i) => {
          if (viTriSao[tenSaoHoa] !== undefined) {
            hoaViTri[HOA_TEN[i]] = viTriSao[tenSaoHoa];
          }
        });

        // ── Phân phối sao vào từng chi-cung ──────────────────
        const saoTrongChi = Array.from({ length: 12 }, () => ({
          chinh: [], cat: [], hung: [], trung: [],
        }));

        // An các sao thường (chính tinh + phụ tinh)
        Object.entries(viTriSao).forEach(([tenSao, chi]) => {
          if (chi === undefined || chi === null) return;
          const meta = D.SAO_META[tenSao];
          if (!meta) return;
          const smLabel = D.SUC_MANH_LABEL[tenSao] ? D.SUC_MANH_LABEL[tenSao][chi] : '';
          const _hanh = D.SAO_HANH[tenSao] || '';
          const starObj = {
            name: tenSao,
            type: meta.type,
            sucManh: smLabel,
            hoaKy: null,
            nguHanh: hanhDon(_hanh),
          };
          saoTrongChi[chi][meta.type === 'chinh' ? 'chinh' :
            meta.type === 'cat' ? 'cat' :
              meta.type === 'hung' ? 'hung' : 'trung'].push(starObj);
        });

        // An Tứ Hóa như sao độc lập
        Object.entries(hoaViTri).forEach(([tenHoa, chi]) => {
          const meta = D.SAO_META[tenHoa];
          if (!meta) return;
          const smLabel = D.SUC_MANH_LABEL[tenHoa] ? D.SUC_MANH_LABEL[tenHoa][chi] : '';
          const _hanh = D.SAO_HANH[tenHoa] || '';
          const starObj = {
            name: tenHoa,
            type: meta.type,
            sucManh: smLabel,
            hoaKy: null,
            nguHanh: hanhDon(_hanh),
          };
          saoTrongChi[chi][meta.type === 'cat' ? 'cat' : 'hung'].push(starObj);
        });

        // An Triệt — mỗi can năm có 2 cung
        const trietChis = D.TRIET[canNam]; // [chi1, chi2]
        trietChis.forEach(chi => {
          saoTrongChi[chi].hung.push({
            name: 'Triệt', type: 'hung', sucManh: '', hoaKy: null, nguHanh: '',
          });
        });

        const chiNoBoc = (chiCungMenh + 5) % 12;
        const chiTatAch = (chiCungMenh + 7) % 12;
        const _hanhTT = D.SAO_HANH['Thiên Thương'] || '';
        const _hanhTS = D.SAO_HANH['Thiên Sứ'] || '';
        saoTrongChi[chiNoBoc].hung.push({
          name: 'Thiên Thương', type: 'hung', sucManh: '', hoaKy: null,
          nguHanh: hanhDon(_hanhTT),
        });
        saoTrongChi[chiTatAch].hung.push({
          name: 'Thiên Sứ', type: 'hung', sucManh: '', hoaKy: null,
          nguHanh: hanhDon(_hanhTS),
        });

        // ── Đại hạn: gán tuổi bắt đầu theo chiều thuận/nghịch ──
        // Thuận: Mệnh(i=0) → PhụMẫu(i=1) → ... chiều kim đồng hồ
        //   chi cung thứ i = (chiCungMenh + i) % 12  ← đúng vì tên cung xếp thuận
        // Nghịch: Mệnh(i=0) → HuynhĐệ(i=1) → PhuThê(i=2) → ...
        //   chi cung thứ i = (chiCungMenh - i + 12) % 12
        // Tuổi bắt đầu đại hạn i: soCuc * (i + 1)
        const daiHanMap = {}; // chiCung → tuổi bắt đầu
        for (let i = 0; i < 12; i++) {
          const chiCungDH = thuanChieu
            ? (chiCungMenh + i) % 12
            : (chiCungMenh - i + 12) % 12;
          daiHanMap[chiCungDH] = soCuc + i * 10;
        }

        // ── Xây dựng 12 cung (thứ tự Mệnh→Huynh Đệ) ──────────
        const cung = [];
        for (let i = 0; i < 12; i++) {
          const chiCung = (chiCungMenh + i) % 12;
          const gridPos = D.CHI_GRID[chiCung];

          const saoCung = [
            ...saoTrongChi[chiCung].chinh,
            ...saoTrongChi[chiCung].cat,
            ...saoTrongChi[chiCung].hung,
            ...saoTrongChi[chiCung].trung,
          ];

          const _daiHan = daiHanMap[chiCung] ?? null;
          // Vòng Trường Sinh: khởi tại TRUONG_SINH_KHOI[soCuc], thuận/nghịch theo thuanChieu
          const khoi = D.TRUONG_SINH_KHOI[soCuc];
          let truongSinh = '';
          if (khoi !== undefined) {
            const idx = thuanChieu
              ? (chiCung - khoi + 12) % 12
              : (khoi - chiCung + 12) % 12;
            truongSinh = D.TRUONG_SINH_TEN[idx];
          }
          cung.push({
            cungChuc: D.TEN_CUNG[i],
            diaChi: D.CHI[chiCung],
            gridRow: gridPos ? gridPos.r : null,
            gridCol: gridPos ? gridPos.c : null,
            isThan: chiCung === chiCungThan,
            daiVan: _daiHan,
            truongSinh: truongSinh,
            sao: saoCung,
          });
        }

        // ── Meta tổng quan ───────────────────────────────────
        return {
          meta: {
            hoTen,
            ngayAL: ngay, thangAL: thang, namAL: nam,
            gioSinh,
            gioiTinh,
            canNam: D.CAN[canNam],
            chiNam: D.CHI[chiNam],
            tenChiGio: D.CHI[chiGio],
            chiCungMenh: D.CHI[chiCungMenh],
            chiCungThan: D.CHI[chiCungThan],
            canCungMenh: D.CAN[canCungMenh],
            tenCuc: D.TEN_CUC[soCuc],
            thuanChieu,
            viTriTriet: D.TRIET[canNam],
            viTriTuan: D.TUAN[chiNam][canNam],
            napAm: D.getNapAm(canNam, chiNam),
          },
          cung,
        };
      }

      return { compute, chiGioFromStr };
    })();

  </script>
  <script>
    const TUVI_RENDER = (() => {

      // ── Lookup helpers: infer số từ string ───────────────────
      const CHI_STR  = ['Tý','Sửu','Dần','Mão','Thìn','Tị','Ngọ','Mùi','Thân','Dậu','Tuất','Hợi'];
      const CAN_STR  = ['Giáp','Ất','Bính','Đinh','Mậu','Kỷ','Canh','Tân','Nhâm','Quý'];
      const CUNG_STR = ['Mệnh','Phụ Mẫu','Phúc Đức','Điền Trạch','Quan Lộc','Nô Bộc','Thiên Di','Tật Ách','Tài Bạch','Tử Tức','Phu Thê','Huynh Đệ'];
      const CUC_SO   = { 'Thủy Nhị Cục':2,'Mộc Tam Cục':3,'Kim Tứ Cục':4,'Thổ Ngũ Cục':5,'Hỏa Lục Cục':6 };

      function chiIdx(str)  { return CHI_STR.indexOf(str); }
      function canIdx(str)  { return CAN_STR.indexOf(str); }
      function cungIdx(str) { return CUNG_STR.indexOf(str); }
      function cucSo(str)   { return CUC_SO[str] ?? 0; }

      const SM_CLASS = { 'M': 'sm-m', 'V': 'sm-v', 'B': 'sm-b', 'H': 'sm-h' };

      // ── Tên hiển thị rút gọn ─────────────────────────────────
      const DISPLAY_NAME = { 'Lưu Niên Văn Tinh': 'LN. Văn Tinh' };
      function dn(name) { return DISPLAY_NAME[name] || name; }

      // ── Màu ngũ hành (render tự tính từ nguHanh trong JSON) ──
      const HANH_COLOR = {
        kim: '#a8a8b0',  // bạc
        moc: '#2d6a2d',  // xanh lá
        thuy: '#111118',  // đen
        hoa: '#c0392b',  // đỏ
        tho: '#c8960a',  // vàng
      };
      function hanhStyle(nguHanh) {
        // Mono mode: bỏ màu ngũ hành
        if (getComputedStyle(document.documentElement).getPropertyValue('--mono-mode').trim() === '1') return '';
        if (!nguHanh) return '';
        const c = HANH_COLOR[nguHanh];
        return c ? `color:${c}` : '';
      }

      // sucManh hiển thị dạng "(M)" inline, màu sẽ do parent div quyết định
      const SM_LABEL = { 'M': '(M)', 'V': '(V)', 'B': '(B)', 'H': '(H)' };
      function smTag(star) {
        return star.sucManh && SM_LABEL[star.sucManh]
          ? `<span class="sm-inline">${SM_LABEL[star.sucManh]}</span>` : '';
      }
      // Tam hợp: Thân-Tý-Thìn, Tị-Dậu-Sửu, Dần-Ngọ-Tuất, Hợi-Mão-Mùi
      const TAM_HOP = [
        [8, 0, 4],   // Thân Tý Thìn
        [5, 9, 1],   // Tị  Dậu Sửu
        [2, 6, 10],  // Dần Ngọ Tuất
        [11, 3, 7],  // Hợi Mão Mùi
      ];
      // Đối cung: cách nhau 6
      function doiCung(chi) { return (chi + 6) % 12; }
      function tamHopGroup(chi) { return TAM_HOP.find(g => g.includes(chi)) || []; }

      // ============================================================
      // Rule engine (click cung/chính tinh để luận rule thỏa)
      // ============================================================
      const RULE_TEXT_MENH = String.raw`
// =====================================================
// THẤT SÁT ĐỘC TỌA DẦN/THÂN (CUNG MỆNH)
// =====================================================

// --- BASE ---
Rule: (thất sát, mệnh, tọa thủ); (thất sát, $this, tọa thủ); (thất sát, dần, tọa thủ); (tử vi&thiên phủ, thân, tọa thủ)
Explain: Cách Thất Sát ngưỡng đầu - mệnh tại Dần, đối cung có Tử Phủ. Chủ về có năng lực quản lý tốt, đảm trách công việc một mình, là nhân viên chủ quản.

Rule: (thất sát, mệnh, tọa thủ); (thất sát, $this, tọa thủ); (thất sát, thân, tọa thủ); (tử vi&thiên phủ, dần, tọa thủ)
Explain: Cách Thất Sát triều đầu (tốt hơn cung Dần) - mệnh tại Thân, đối cung có Tử Phủ. Chủ về có năng lực quản lý cực tốt, đảm trách công việc một mình, là nhân viên chủ quản.

Rule: (thất sát, mệnh, tọa thủ); (thất sát, $this, tọa thủ); (thất sát, dần|thân, tọa thủ)
Explain: Cung Mệnh có Thất Sát tại Dần/Thân: Cuộc đời ắt sẽ có một lần gặp sóng gió rất lớn; nhẹ thì sự nghiệp đình đốn, sầu khổ. Cần hành động thiết thực để vượt qua.

// --- CÁT: Lộc Tồn ---
Rule: (thất sát, mệnh, tọa thủ); (thất sát, $this, tọa thủ); (thất sát, dần|thân, tọa thủ); (lộc tồn, mệnh|thiên di, tọa thủ)
Explain: Cung mệnh hoặc thiên di gặp Lộc Tồn - chủ về tài lộc dồi dào, không lo thiếu thốn tiền bạc.

// --- HUNG: Sát tinh ---
Rule: (thất sát, mệnh, tọa thủ); (thất sát, $this, tọa thủ); (thất sát, dần|thân, tọa thủ); (sát tinh, $this, tọa thủ|hội hợp)
Explain: Mệnh Thất Sát gặp sát tinh hội hợp - chủ về đường đời nhiều gập ghềnh, trắc trở.

// --- NGHỀ NGHIỆP ---
Rule: (thất sát, mệnh, tọa thủ); (thất sát, $this, tọa thủ); (thất sát, dần|thân, tọa thủ)
Explain: Nghề nghiệp phù hợp: làm việc cho chính phủ, quản lý nhân sự, hành chính cho công ty lớn, hoặc quản lý công xưởng.

Rule: (thất sát, mệnh, tọa thủ); (thất sát, $this, tọa thủ); (thất sát, dần|thân, tọa thủ); (văn xương|văn khúc, $this, hội hợp)
Explain: Mệnh có Thất Sát gặp Xương Khúc hội chiếu - có thể làm nghiên cứu khoa học kỹ thuật hoặc là nhà giáo mẫu mực.

Rule: (thất sát, mệnh, tọa thủ); (thất sát, $this, tọa thủ); (thất sát, dần|thân, tọa thủ); (tử vi, thiên di, tọa thủ); (hóa khoa, thiên di, tọa thủ)
Explain: Tử Vi Hóa Khoa ở đối cung - có thể làm công tác nghiên cứu khoa học kỹ thuật.

Rule: (thất sát, mệnh, tọa thủ); (thất sát, $this, tọa thủ); (thất sát, dần|thân, tọa thủ); (thiên phủ, thiên di, tọa thủ); (hóa khoa, thiên di, tọa thủ)
Explain: Thiên Phủ Hóa Khoa ở đối cung - có thể nghiên cứu kinh tế hoặc quản lý công thương.

Rule: (thất sát, mệnh, tọa thủ); (thất sát, $this, tọa thủ); (thất sát, dần|thân, tọa thủ); (sát tinh, $this, hội hợp); (hóa kỵ, $this, hội hợp); (thiên hình, $this, hội hợp); (thiên mã, $this, hội hợp); (lộc tồn, $this, hội hợp); (tả phụ&hữu bật&tam thai&bát tọa, $this, hội hợp)
Explain: Sát tinh nặng gặp thêm Kỵ Hình Mã Lộc và các sao phò tá - có thể gia nhập quân đội, cảnh sát hoặc làm lãnh đạo chính giới.

// --- HUNG NẶNG: Hình khắc / Phá tán ---
Rule: (thất sát, mệnh, tọa thủ); (thất sát, $this, tọa thủ); (thất sát, dần|thân, tọa thủ); (lộc tồn|hóa lộc, $this, NOT hội hợp); (tứ sát, $this, hội hợp); (địa không|địa kiếp, $this, hội hợp); (thiên hình, $this, hội hợp); (đại hao, $this, hội hợp)
Explain: Không gặp sao lộc mà gặp nhiều hung sát tinh - cuộc đời bị hình khắc rất nặng, tính tình ngoan cố, ương ngạnh. Tuy phú quý nhưng vẫn bị phá tán, thất bại, cuộc đời cô tịch.
`;
      const RULE_TEXT_PHU_MAU = '';
      const RULE_TEXT_PHUC_DUC = '';
      const RULE_TEXT_DIEN_TRACH = '';
      const RULE_TEXT_QUAN_LOC = '';
      const RULE_TEXT_NO_BOC = '';
      const RULE_TEXT_THIEN_DI = '';
      const RULE_TEXT_TAT_ACH = '';
      const RULE_TEXT_TAI_BACH = '';
      const RULE_TEXT_TU_TUC = '';
      const RULE_TEXT_PHU_THE = '';
      const RULE_TEXT_HUYNH_DE = '';

      const RULE_TEXT_BY_CUNG = {
        menh: RULE_TEXT_MENH,
        'phu mau': RULE_TEXT_PHU_MAU,
        'phuc duc': RULE_TEXT_PHUC_DUC,
        'dien trach': RULE_TEXT_DIEN_TRACH,
        'quan loc': RULE_TEXT_QUAN_LOC,
        'no boc': RULE_TEXT_NO_BOC,
        'thien di': RULE_TEXT_THIEN_DI,
        'tat ach': RULE_TEXT_TAT_ACH,
        'tai bach': RULE_TEXT_TAI_BACH,
        'tu tuc': RULE_TEXT_TU_TUC,
        'phu the': RULE_TEXT_PHU_THE,
        'huynh de': RULE_TEXT_HUYNH_DE,
      };

      const STAR_GROUPS = {
        'sat tinh': ['kình dương', 'đà la', 'hỏa tinh', 'linh tinh', 'địa không', 'địa kiếp'],
        'luc sat tinh': ['kình dương', 'đà la', 'hỏa tinh', 'linh tinh', 'địa không', 'địa kiếp'],
        'tu sat': ['kình dương', 'đà la', 'hỏa tinh', 'linh tinh'],
      };

      function vnNorm(s) {
        return (s || '')
          .toLowerCase()
          .replace(/đ/g, 'd')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/\s+/g, ' ')
          .trim();
      }

      function getRuleTextForCung(cungName) {
        return RULE_TEXT_BY_CUNG[vnNorm(cungName)] || '';
      }

      function parseRuleBlocks(text) {
        const blocks = text.match(/Rule:\s*[\s\S]*?(?=(?:\n\s*Rule:)|\s*$)/g) || [];
        return blocks.map(block => {
          const ruleMatch = block.match(/Rule:\s*([^\n]+)/);
          const explainMatch = block.match(/Explain:\s*([\s\S]*?)(?=(?:\n\s*Raw:)|\s*$)/);
          const rawMatch = block.match(/Raw:\s*([\s\S]*?)\s*$/);
          return {
            rule: (ruleMatch?.[1] || '').trim(),
            explain: (explainMatch?.[1] || '').trim(),
            raw: (rawMatch?.[1] || '').trim(),
          };
        }).filter(x => x.rule && x.explain);
      }

      function parseCondition(condText) {
        const m = condText.trim().match(/^\((.*)\)$/);
        if (!m) return null;
        const parts = m[1].split(',').map(s => s.trim());
        if (parts.length !== 3) return null;
        return { starExpr: parts[0], posExpr: parts[1], relExpr: parts[2] };
      }

      function splitAndOr(expr) {
        const andTerms = expr.split('&').map(t => t.trim()).filter(Boolean);
        return andTerms.map(t => t.split('|').map(x => x.trim()).filter(Boolean));
      }

      function expandStarToken(token) {
        const k = vnNorm(token);
        if (STAR_GROUPS[k]) return STAR_GROUPS[k].map(vnNorm);
        return [k];
      }

      function buildChartIndex(lasoJson) {
        const chiToStars = {};
        const cungNameToChi = {};
        lasoJson.cung.forEach(c => {
          const ci = chiIdx(c.diaChi);
          cungNameToChi[vnNorm(c.cungChuc)] = ci;
          chiToStars[ci] = (c.sao || []).map(s => vnNorm(s.name));
        });
        return { chiToStars, cungNameToChi };
      }

      function resolvePosToken(posToken, contextChi, chartIndex) {
        const k = vnNorm(posToken);
        if (k === '$this') return [contextChi];
        if (k === 'cung menh') {
          const cungMenh = (_lastJson?.cung || []).find(c => c.isMenh);
          return cungMenh ? [chiIdx(cungMenh.diaChi)] : [];
        }
        if (chartIndex.cungNameToChi[k] !== undefined) return [chartIndex.cungNameToChi[k]];
        const chiPos = CHI_STR.findIndex(x => vnNorm(x) === k);
        if (chiPos >= 0) return [chiPos];
        return [];
      }

      function starsInRelation(posChi, relationName, chartIndex) {
        const rel = vnNorm(relationName);
        let chis = [];
        if (rel === 'toa thu') chis = [posChi];
        else if (rel === 'xung chieu') chis = [doiCung(posChi)];
        else if (rel === 'hoi hop') chis = [posChi, doiCung(posChi), ...tamHopGroup(posChi)];
        else return new Set();
        const set = new Set();
        chis.forEach(chi => (chartIndex.chiToStars[chi] || []).forEach(s => set.add(s)));
        return set;
      }

      function matchStarExpr(starExpr, starSet) {
        const andTerms = splitAndOr(starExpr);
        return andTerms.every(orTerms =>
          orTerms.some(tok => expandStarToken(tok).some(s => starSet.has(s)))
        );
      }

      function relationExprSatisfied(starExpr, relExpr, posChi, chartIndex) {
        const andTerms = splitAndOr(relExpr);
        return andTerms.every(orTerms =>
          orTerms.some(raw => {
            const neg = /^NOT\s+/i.test(raw);
            const relName = raw.replace(/^NOT\s+/i, '').trim();
            const starSet = starsInRelation(posChi, relName, chartIndex);
            if (!starSet.size) return false;
            const yes = matchStarExpr(starExpr, starSet);
            return neg ? !yes : yes;
          })
        );
      }

      function conditionSatisfied(cond, contextChi, chartIndex) {
        const posAndTerms = splitAndOr(cond.posExpr);
        return posAndTerms.every(orTerms => {
          const posCandidates = new Set();
          orTerms.forEach(tok => resolvePosToken(tok, contextChi, chartIndex).forEach(p => posCandidates.add(p)));
          if (!posCandidates.size) return false;
          for (const pos of posCandidates) {
            if (relationExprSatisfied(cond.starExpr, cond.relExpr, pos, chartIndex)) return true;
          }
          return false;
        });
      }

      function conditionReferencesContext(cond, contextChi, chartIndex) {
        const posAndTerms = splitAndOr(cond.posExpr);
        return posAndTerms.some(orTerms =>
          orTerms.some(tok => {
            if (vnNorm(tok) === '$this') return true;
            const resolved = resolvePosToken(tok, contextChi, chartIndex);
            return resolved.includes(contextChi);
          })
        );
      }

      function evaluateRulesForCung(contextChi, cungName, lasoJson, onlyStarName = '') {
        const chartIndex = buildChartIndex(lasoJson);
        const rules = parseRuleBlocks(getRuleTextForCung(cungName));
        const starNeed = vnNorm(onlyStarName);
        const hits = [];
        rules.forEach(r => {
          const conds = r.rule.split(';').map(s => s.trim()).filter(Boolean).map(parseCondition).filter(Boolean);
          if (!conds.length) return;
          if (!conds.some(c => conditionReferencesContext(c, contextChi, chartIndex))) return;
          const ok = conds.every(c => conditionSatisfied(c, contextChi, chartIndex));
          if (!ok) return;
          if (starNeed) {
            const matchedStarToken = conds.some(c => vnNorm(c.starExpr).includes(starNeed));
            if (!matchedStarToken) return;
          }
          hits.push({ ...r });
        });
        return hits;
      }

      function renderRuleHitsHtml(cungData, hits, onlyStarName = '') {
        const starTitle = onlyStarName ? ` cho chính tinh <b>${onlyStarName}</b>` : '';
        if (!hits.length) {
          return `<div>Không có rule nào khớp cho cung <b>${cungData.cungChuc}</b> (${cungData.diaChi})${starTitle}.</div>`;
        }
        const list = hits.map((h, i) => `
          <div class="rule-hit">
            <div><b>Rule ${i + 1}</b> - ${h.explain}</div>
            <div class="rule-hit-rule">Rule: ${h.rule}</div>
            ${h.raw ? `<div style="margin-top:6px;color:#5a4630;"><i>Raw: ${h.raw}</i></div>` : ''}
          </div>
        `).join('');
        return `<div style="margin-bottom:8px;color:#6e4d1a;">Tìm thấy <b>${hits.length}</b> rule khớp${starTitle}.</div>${list}`;
      }

      function openRuleModalForChi(chi, onlyStarName = '') {
        if (!_lastJson || !_lastJson.cung) return;
        const cungData = _lastJson.cung.find(c => chiIdx(c.diaChi) === chi);
        if (!cungData) return;
        const hits = evaluateRulesForCung(chi, cungData.cungChuc, _lastJson, onlyStarName);
        const titleEl = document.getElementById('ruleModalTitle');
        const bodyEl = document.getElementById('ruleModalBody');
        if (!titleEl || !bodyEl) return;
        titleEl.textContent = `Luận cung ${cungData.cungChuc} (${cungData.diaChi})`;
        bodyEl.innerHTML = renderRuleHitsHtml(cungData, hits, onlyStarName);
        document.getElementById('ruleOverlay')?.classList.add('open');
      }

      function onCungTitleLeftClick(event, chi) {
        if (event && event.button !== 0) return;
        if (event) { event.preventDefault(); event.stopPropagation(); }
        openRuleModalForChi(chi);
      }

      function onChinhTinhClick(event, chi, starName) {
        if (event && event.button !== 0) return;
        if (event) { event.preventDefault(); event.stopPropagation(); }
        openRuleModalForChi(chi, starName);
      }

      // ── Màu địa chi theo ngũ hành ───────────────────────────
      // Tý=0,Sửu=1,Dần=2,Mão=3,Thìn=4,Tị=5,Ngọ=6,Mùi=7,Thân=8,Dậu=9,Tuất=10,Hợi=11
      const CHI_MAU = {
        0: '#111118',  // Tý  — thủy
        1: '#c8960a',  // Sửu — thổ
        2: '#2d6a2d',  // Dần — mộc
        3: '#2d6a2d',  // Mão — mộc
        4: '#c8960a',  // Thìn — thổ
        5: '#c0392b',  // Tị  — hỏa
        6: '#c0392b',  // Ngọ — hỏa
        7: '#c8960a',  // Mùi — thổ
        8: '#a8a8b0',  // Thân — kim
        9: '#a8a8b0',  // Dậu  — kim
        10: '#c8960a',  // Tuất — thổ
        11: '#111118',  // Hợi  — thủy
      };

      // ── Render header (TOP) ─────────────────────────────────
      // Chữ cái đầu thiên can
      const CAN_VIET_DAU = ['G', 'Ấ', 'B', 'Đ', 'M', 'K', 'C', 'T', 'N', 'Q'];

      function renderHeader({ cungChuc, diaChi, daiVan, isThan, canCung, tenThang }) {
        const badge = isThan ? `<span class="badge badge-t">THÂN</span>` : '';
        const isMono = getComputedStyle(document.documentElement).getPropertyValue('--mono-mode').trim() === '1';
        const ci = chiIdx(diaChi);
        const chiColor = (!isMono && CHI_MAU[ci]) ? ` style="color:${CHI_MAU[ci]}"` : '';
        const canStr = canCung !== undefined ? `${CAN_VIET_DAU[canCung]}.` : '';
        const thangBadge = tenThang ? `<span class="top-thang-inner">${tenThang}</span>` : '';
        return `<div class="cung-top">
      <span class="top-chi"${chiColor}>${canStr}${diaChi}</span>
      <span class="top-ten" title="Click để luận cung"
        onclick="TUVI_RENDER.onCungTitleLeftClick(event, ${ci})">${cungChuc.toUpperCase()}${badge}</span>
      <span class="top-dh">${daiVan !== null ? daiVan : ''}${thangBadge ? `<span class="top-thang">${thangBadge}</span>` : ''}</span>
    </div>`;
      }

      // ── Sao in đậm ──────────────────────────────────────────
      const CAT_BOLD = new Set(['Thiên Khôi', 'Thiên Việt', 'Tả Phụ', 'Hữu Bật', 'Văn Xương', 'Văn Khúc',
        'Hóa Lộc', 'Hóa Quyền', 'Hóa Khoa', 'Hóa Kỵ', 'Hồng Loan', 'Đào Hoa']);
      const HUNG_BOLD = new Set(['Đà La', 'Kình Dương', 'Địa Kiếp', 'Địa Không', 'Linh Tinh', 'Hỏa Tinh',
        'Hóa Kỵ', 'Thiên Không', 'Cô Thần', 'Quả Tú', 'Thiên Hình', 'Thiên Diêu']);

      // ── Render MIDDLE ────────────────────────────────────────
      function renderMiddle(saoCung, dvSao = [], chi) {
        const chinh = saoCung.filter(s => s.type === 'chinh');
        const cat = saoCung.filter(s => s.type === 'cat');
        const hung = saoCung.filter(s => s.type === 'hung');
        const trung = saoCung.filter(s => s.type === 'trung');

        const chinhLines = ['', ''];
        chinh.forEach((s, i) => {
          if (i < 2) {
            const _ms = hanhStyle(s.nguHanh);
            const safeStar = String(s.name || '').replace(/"/g, '&quot;');
            chinhLines[i] = `<div class="sao-chinh" title="Click để luận theo chính tinh"
            onclick="TUVI_RENDER.onChinhTinhClick(event, ${chi}, &quot;${safeStar}&quot;)"${_ms ? ` style="${_ms}"` : ''}>${s.name.toUpperCase()}${smTag(s)}</div>`;
          }
        });
        const chinhHtml = `<div class="mid-chinh">
      <div class="chinh-row">${chinhLines[0] || '<div class="chinh-empty"></div>'}</div>
      <div class="chinh-row">${chinhLines[1] || '<div class="chinh-empty"></div>'}</div>
    </div>`;

        const catList = [...cat, ...trung].sort((a, b) => (CAT_BOLD.has(b.name) ? 1 : 0) - (CAT_BOLD.has(a.name) ? 1 : 0));
        const hungList = hung.sort((a, b) => (HUNG_BOLD.has(b.name) ? 1 : 0) - (HUNG_BOLD.has(a.name) ? 1 : 0));

        const catHtml = catList.map(s => {
          const bold = CAT_BOLD.has(s.name) ? ' bold' : '';
          const _ms = hanhStyle(s.nguHanh);
          return `<div class="sao-cat${bold}"${_ms ? ` style="${_ms}"` : ''}>${dn(s.name)}${smTag(s)}</div>`;
        }).join('');
        const hungHtml = hungList.map(s => {
          if (s.name === 'Triệt') return '';
          const bold = HUNG_BOLD.has(s.name) ? ' bold' : '';
          const _ms = hanhStyle(s.nguHanh);
          return `<div class="sao-hung${bold}"${_ms ? ` style="${_ms}"` : ''}>${dn(s.name)}${smTag(s)}</div>`;
        }).join('');

        // Sao lưu ĐV - bỏ "ĐV." lấy tên thật, tra SAO_META/SAO_HANH để lấy class và màu
        let dvSaoCatHtml = '', dvSaoHungHtml = '';
        dvSao.forEach(t => {
          const tenThat = t.replace(/^(ĐV\.|L\.)/, '');
          const meta2 = TUVI_DATA.SAO_META[tenThat];
          const hanhRaw = TUVI_DATA.SAO_HANH[tenThat] || '';
          const hanh = hanhRaw.split('-')[0];
          const isHung = meta2?.type === 'hung';
          const isBold = isHung ? HUNG_BOLD.has(tenThat) : CAT_BOLD.has(tenThat);
          const cls = (isHung ? 'sao-hung' : 'sao-cat') + (isBold ? ' bold' : '');
          const _ms = hanhStyle(hanh);
          const html2 = `<div class="${cls}"${_ms ? ` style="${_ms}"` : ''}>${t}</div>`;
          if (isHung) dvSaoHungHtml += html2;
          else dvSaoCatHtml += html2;
        });

        return `<div class="cung-mid">${chinhHtml}<div class="mid-cathung-wrap"><div class="mid-cathung">
      <div class="col-cat">${catHtml}${dvSaoCatHtml}</div>
      <div class="col-hung">${hungHtml}${dvSaoHungHtml}</div>
    </div></div></div>`;
      }

      // ── Render footer (BOTTOM) ──────────────────────────────
      function renderFooter({ truongSinh, thang, daiHan, tenDV, tenLN }) {
        const dvHtml = tenDV
          ? `<span class="bot-dv"><span class="bot-dv-inner">${tenDV}</span></span>`
          : `<span class="bot-dv"></span>`;
        const lnHtml = tenLN ? `<div class="bot-ln"><span class="bot-ln-inner">${tenLN}</span></div>` : '';
        return `<div class="cung-bot">
      <div class="bot-left-col">${dvHtml}</div>
      <span class="bot-ts">${truongSinh}</span>
      <div class="bot-right-col">
        ${lnHtml}
      </div>
    </div>`;
      }

      // ── Render một ô cung ───────────────────────────────────
      function renderCung(cungData) {
        const { diaChi, gridRow, gridCol, sao, dvSao = [] } = cungData;
        const ci = chiIdx(diaChi);
        return `<div class="cung" data-chi="${ci}"
        style="grid-row:${gridRow};grid-column:${gridCol}"
        onclick="TUVI_RENDER.clickCung(${ci})">
      ${renderHeader(cungData)}
      ${renderMiddle(sao, dvSao, ci)}
      ${renderFooter(cungData)}
    </div>`;
      }

      // ── Render ô center 2×2 ─────────────────────────────────
      function renderCenter(meta) {
        const { hoTen, ngayAL, thangAL, namAL, canNam, chiNam, gioSinh, tenChiGio,

      // ── Click cung: highlight tam phương tứ chính ───────────

      function clearHighlight() {

      function setCungClass(chi, cls) {

      // ── Hàm chính ───────────────────────────────────────────
      // ── Render pill Triệt ───────────────────────────────────
      // CHI_GRID: 5=r1c1, 6=r1c2, 7=r1c3, 8=r1c4, 9=r2c4, 10=r3c4,
      //          11=r4c4, 0=r4c3, 1=r4c2, 2=r4c1, 3=r3c1, 4=r2c1
      const CHI_GRID_R = {
        5: { r: 1, c: 1 }, 6: { r: 1, c: 2 }, 7: { r: 1, c: 3 }, 8: { r: 1, c: 4 },
        9: { r: 2, c: 4 }, 10: { r: 3, c: 4 },
        11: { r: 4, c: 4 }, 0: { r: 4, c: 3 }, 1: { r: 4, c: 2 }, 2: { r: 4, c: 1 },
        3: { r: 3, c: 1 }, 4: { r: 2, c: 1 },
      };

      // ── Helper tính vị trí pill ─────────────────────────────
      function getScale() {
        const scaler = document.getElementById('gridScaler');
        if (!scaler) return 1;
        const m = new DOMMatrix(getComputedStyle(scaler).transform);
        return m.a || 1; // m.a = scaleX
      }

      function pillPos(c1, c2, gridEl) {
        const g1 = CHI_GRID_R[c1], g2 = CHI_GRID_R[c2];
        if (!g1 || !g2) return null;
        const el1 = gridEl.querySelector(`.cung[data-chi="${c1}"]`);
        const el2 = gridEl.querySelector(`.cung[data-chi="${c2}"]`);
        if (!el1 || !el2) return null;
        const gr = gridEl.getBoundingClientRect();
        const scale = getScale();
        const isSameRow = g1.r === g2.r;
        let left, top;
        if (isSameRow) {
          const lEl = g1.c < g2.c ? el1 : el2;
          const rEl = g1.c < g2.c ? el2 : el1;
          const lR = lEl.getBoundingClientRect(), rR = rEl.getBoundingClientRect();
          left = (((lR.right + rR.left) / 2) - gr.left) / scale;
          // Row 1 (Ngọ-Mùi): pill ở border bottom; các row khác: border top
          top = g1.r === 1
            ? (lR.bottom - gr.top) / scale
            : (lR.top - gr.top) / scale;
        } else {
          const tEl = g1.r < g2.r ? el1 : el2;
          const bEl = g1.r < g2.r ? el2 : el1;
          const tR = tEl.getBoundingClientRect(), bR = bEl.getBoundingClientRect();
          left = ((tR.left + tR.right) / 2 - gr.left) / scale;
          top = ((tR.bottom + bR.top) / 2 - gr.top) / scale;
        }
        return { left, top };
      }

      function renderTriet(viTriTriet, gridEl) {

        pill.style.top = pos.top + 'px';
        gridEl.appendChild(pill);

      function tinhCungDVHienTai(meta, namXem) {

        const chiMenhIdx = chiIdx(chiCungMenh);
        const tuoi = namXem - namSinh + 1;
        if (tuoi < 0) return null;
        let sttDV = 0;
        while (true) {
          const start = soCucVal + sttDV * 10;
          const end = start + 9;
          if (tuoi < start) return null;
          if (tuoi >= start && tuoi <= end) break;
          sttDV++;

        const chiDVMenh = thuanChieu
          ? (chiMenhIdx + sttDV) % 12
          : (chiMenhIdx - sttDV + 12 * 10) % 12;
        return chiDVMenh;

        const lnMap = {};

        if (chiDVMenh !== null) {

          const canDVMenh = TUVI_DATA.BANG_THIENCAN_CUNGMENH[canIdx(meta.canNam)][chiDVMenh];

            dvSaoMap[chiSao].push(tenSao);
          });

          Object.entries(L_SAO_THEO_CAN).forEach(([tenSao, arr]) => {
            const chiSao = arr[canNamXem];
            if (!dvSaoMap[chiSao]) dvSaoMap[chiSao] = [];
            dvSaoMap[chiSao].push(tenSao);

            const chiSao = arr[chiNamXem];
            if (!dvSaoMap[chiSao]) dvSaoMap[chiSao] = [];
            dvSaoMap[chiSao].push(tenSao);

          const HOA_TEN = ['Hóa Lộc', 'Hóa Quyền', 'Hóa Khoa', 'Hóa Kỵ'];
          // Lookup: tên sao → chiIndex của cung chứa sao đó (từ cung[])
          const chiCuaSao = (tenSao) => {
            const c = cung.find(c => c.sao.some(s => s.name === tenSao));
            return c ? chiIdx(c.diaChi) : undefined;
          };
          TUVI_DATA.TU_HOA[canDVMenh].forEach((tenSaoHoa, i) => {
            const chiSao = chiCuaSao(tenSaoHoa);
            if (chiSao !== undefined) {
              if (!dvSaoMap[chiSao]) dvSaoMap[chiSao] = [];
              dvSaoMap[chiSao].push(`ĐV.${HOA_TEN[i]}`);

          });

          // L.Tứ Hóa: theo thiên can năm xem hạn
          TUVI_DATA.TU_HOA[canNamXem].forEach((tenSaoHoa, i) => {
            const chiSao = chiCuaSao(tenSaoHoa);
            if (chiSao !== undefined) {
              if (!dvSaoMap[chiSao]) dvSaoMap[chiSao] = [];
              dvSaoMap[chiSao].push(`L.${HOA_TEN[i]}`);

        // Lưu Tuần: theo địa chi + thiên can NĂM XEM
        if (xemHan) {

      const gridH = grid.offsetHeight;
      const outerW = outer.clientWidth; // đã trừ padding 5px mỗi bên

        colChat.classList.add('visible');

## Phân tích tương quan cung Mệnh và cung Thân
Theo thời gian, vai trò cung Thân ngày càng tăng, vai trò cung Mệnh dần giảm, nhất từ tuổi trung niên trở đi.
- Mệnh mạnh, Thân yếu: chí lớn nhưng hành động không đủ, thường sai, không quyết đoán.
- Mệnh mạnh, Thân mạnh: chí lớn và hành động đủ tốt để đạt được chí.
- Mệnh yếu, Thân yếu: ý chí không đủ và hành động cũng không đủ, thường sai, không quyết đoán.
- Mệnh yếu, Thân mạnh: chí không đủ, nhưng về sau hành động vững vàng, biết phấn đấu vươn lên.

      if (!text) return;
      if (!apiKey) { alert('Vui lòng nhập API Key'); return; }
      if (!_chatJson) { alert('Hãy lập lá số trước'); return; }

      if (!customText) input.value = '';
      document.getElementById('chatSend').disabled = true;
      document.getElementById('skillMenh').disabled = true;

      addMsg('user', text);

      // Thêm vào history
      if (_chatHistory.length === 0) {
        _chatHistory.push({
          role: 'user',
          content: `Đây là JSON lá số:\n\`\`\`json\n${JSON.stringify(_chatJson)}\n\`\`\`\n\n${text}`
        });
      } else {
        _chatHistory.push({ role: 'user', content: text });
      }

      // Tạo bubble streaming
      const el = document.getElementById('chatMessages');
      const bubble = document.createElement('div');
      bubble.className = 'chat-msg assistant';
      bubble.textContent = '';
      el.appendChild(bubble);
      el.scrollTop = el.scrollHeight;

      let fullReply = '';

      try {
        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true',
          },
          body: JSON.stringify({
            model: 'claude-sonnet-4-5-20251022',
            max_tokens: 1024,
            stream: true,
            system: SYSTEM_PROMPT,
            messages: _chatHistory,
          }),
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error?.message || res.statusText);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });

          const lines = buf.split('\n');
          buf = lines.pop(); // giữ dòng chưa hoàn chỉnh

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const data = line.slice(6).trim();
            if (data === '[DONE]') break;
            try {
              const evt = JSON.parse(data);
              if (evt.type === 'content_block_delta' && evt.delta?.text) {
                fullReply += evt.delta.text;
                bubble.textContent = fullReply;
                el.scrollTop = el.scrollHeight;
              }
            } catch { }
          }
        }

        _chatHistory.push({ role: 'assistant', content: fullReply });

      } catch (e) {
        bubble.textContent = '⚠ Lỗi: ' + e.message;
        bubble.classList.add('thinking');
      }

      document.getElementById('chatSend').disabled = false;
      document.getElementById('skillMenh').disabled = false;
    }

    // ── Chuyển đổi Dương lịch ↔ Âm lịch ────────────────────
    // Port từ C++ (Hồ Ngọc Đức algorithm)
    const TIMEZONE = 7; // GMT+7

    function jdFromDate(dd, mm, yy) {
      const a = Math.floor((14 - mm) / 12);
      const y = yy + 4800 - a;
      const m = mm + 12 * a - 3;
      let jd = dd + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;
      if (jd < 2299161) jd = dd + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - 32083;
      return jd;
    }

    function jdToDate(jd) {
      let a, b, c;
      if (jd > 2299160) {
        a = jd + 32044;
        b = Math.floor((4 * a + 3) / 146097);
        c = a - Math.floor(b * 146097 / 4);
      } else { b = 0; c = jd + 32082; }
      const d = Math.floor((4 * c + 3) / 1461);
      const e = c - Math.floor(1461 * d / 4);
      const m = Math.floor((5 * e + 2) / 153);
      const day = e - Math.floor((153 * m + 2) / 5) + 1;
      const month = m + 3 - 12 * Math.floor(m / 10);
      const year = b * 100 + d - 4800 + Math.floor(m / 10);
      return [day, month, year];
    }

    function sunLongitude(jdn) {
      const T = (jdn - 2451545.0) / 36525;
      const T2 = T * T;
      const dr = Math.PI / 180;
      const M = 357.52910 + 35999.05030 * T - 0.0001559 * T2 - 0.00000048 * T * T2;
      const L0 = 280.46645 + 36000.76983 * T + 0.0003032 * T2;
      let DL = (1.914600 - 0.004817 * T - 0.000014 * T2) * Math.sin(dr * M);
      DL += (0.019993 - 0.000101 * T) * Math.sin(dr * 2 * M) + 0.000290 * Math.sin(dr * 3 * M);
      let L = L0 + DL;
      L -= 360 * Math.floor(L / 360);
      return L;
    }

    function newMoon(k) {
      const T = k / 1236.85;
      const T2 = T * T, T3 = T2 * T;
      const dr = Math.PI / 180;
      let Jd1 = 2415020.75933 + 29.53058868 * k + 0.0001178 * T2 - 0.000000155 * T3;
      Jd1 += 0.00033 * Math.sin((166.56 + 132.87 * T - 0.009173 * T2) * dr);
      const M = 359.2242 + 29.10535608 * k - 0.0000333 * T2 - 0.00000347 * T3;
      const Mpr = 306.0253 + 385.81691806 * k + 0.0107306 * T2 + 0.00001236 * T3;
      const F = 21.2964 + 390.67050646 * k - 0.0016528 * T2 - 0.00000239 * T3;
      let C1 = (0.1734 - 0.000393 * T) * Math.sin(M * dr) + 0.0021 * Math.sin(2 * dr * M)
        - 0.4068 * Math.sin(Mpr * dr) + 0.0161 * Math.sin(dr * 2 * Mpr)
        - 0.0004 * Math.sin(dr * 3 * Mpr)
        + 0.0104 * Math.sin(dr * 2 * F) - 0.0051 * Math.sin(dr * (M + Mpr))
        - 0.0074 * Math.sin(dr * (M - Mpr)) + 0.0004 * Math.sin(dr * (2 * F + M))
        - 0.0004 * Math.sin(dr * (2 * F - M)) - 0.0006 * Math.sin(dr * (2 * F + Mpr))
        + 0.0010 * Math.sin(dr * (2 * F - Mpr)) + 0.0005 * Math.sin(dr * (2 * Mpr + M));
      const deltat = T < -11
        ? 0.001 + 0.000839 * T + 0.0002261 * T2 - 0.00000845 * T3 - 0.000000081 * T * T3
        : -0.000278 + 0.000265 * T + 0.000262 * T2;
      return Jd1 + C1 - deltat;
    }

    function getSunLongitude(dayNumber, tz) { return sunLongitude(dayNumber - 0.5 - tz / 24); }
    function getNewMoonDay(k, tz) { return Math.floor(newMoon(k) + 0.5 + tz / 24); }

    function getLunarMonth11(yy, tz) {
      const off = jdFromDate(31, 12, yy) - 2415021.076998695;
      const k = Math.floor(off / 29.530588853);
      let nm = getNewMoonDay(k, tz);
      const sl = Math.floor(getSunLongitude(nm, tz) / 30);
      if (sl >= 9) nm = getNewMoonDay(k - 1, tz);
      return nm;
    }

    function getLeapMonthOffset(a11, tz) {
      const k = Math.floor(0.5 + (a11 - 2415021.076998695) / 29.530588853);
      let i = 1, last = 0;
      let arc = Math.floor(getSunLongitude(getNewMoonDay(k + i, tz), tz) / 30);
      do {
        last = arc; i++;
        arc = Math.floor(getSunLongitude(getNewMoonDay(k + i, tz), tz) / 30);
      } while (arc !== last && i < 14);
      return i - 1;
    }

    function solar2Lunar(dd, mm, yy, tz = TIMEZONE) {
      const dayNumber = jdFromDate(dd, mm, yy);
      const k = Math.floor((dayNumber - 2415021.076998695) / 29.530588853);
      let monthStart = getNewMoonDay(k + 1, tz);
      if (monthStart > dayNumber) monthStart = getNewMoonDay(k, tz);
      let a11 = getLunarMonth11(yy, tz);
      let b11 = a11;
      let lunarYear;
      if (a11 >= monthStart) {
        lunarYear = yy;
        a11 = getLunarMonth11(yy - 1, tz);
      } else {
        lunarYear = yy + 1;
        b11 = getLunarMonth11(yy + 1, tz);
      }
      const lunarDay = dayNumber - monthStart + 1;
      const diff = Math.floor((monthStart - a11) / 29);
      let lunarLeap = 0;
      let lunarMonth = diff + 11;
      if (b11 - a11 > 365) {
        const leapOff = getLeapMonthOffset(a11, tz);
        if (diff >= leapOff) {
          lunarMonth = diff + 10;
          if (diff === leapOff) lunarLeap = 1;
        }
      }
      if (lunarMonth > 12) lunarMonth -= 12;
      if (lunarMonth >= 11 && diff < 4) lunarYear -= 1;
      return { ngay: lunarDay, thang: lunarMonth, nam: lunarYear, nhuan: lunarLeap };
    }

    function lunar2Solar(lDay, lMonth, lYear, lLeap = 0, tz = TIMEZONE) {
      let a11, b11;
      if (lMonth < 11) {
        a11 = getLunarMonth11(lYear - 1, tz);
        b11 = getLunarMonth11(lYear, tz);
      } else {
        a11 = getLunarMonth11(lYear, tz);
        b11 = getLunarMonth11(lYear + 1, tz);
      }
      let off = lMonth - 11;
      if (off < 0) off += 12;

      if (b11 - a11 > 365) {
        const leapOff = getLeapMonthOffset(a11, tz);
        let leapMonth = leapOff - 2;
        if (leapMonth < 0) leapMonth += 12;
        if (lLeap !== 0 && lMonth !== leapMonth) return [0, 0, 0];
        if (lLeap !== 0 || off >= leapOff) off += 1;
      }
      const k = Math.floor(0.5 + (a11 - 2415021.076998695) / 29.530588853);
      const monthStart = getNewMoonDay(k + off, tz);
      return jdToDate(monthStart + lDay - 1);
    }

    function getLunarMonthDaysNoLeap(thang, nam) {
      const [dd0, mm0, yy0] = lunar2Solar(1, thang, nam, 0);
      if (!dd0 || !mm0 || !yy0) return 30;
      const jd0 = jdFromDate(dd0, mm0, yy0);
      let days = 0;
      for (let i = 0; i < 35; i++) {
        const [dd, mm, yy] = jdToDate(jd0 + i);
        const l = solar2Lunar(dd, mm, yy);
        if (l.thang === thang && l.nam === nam && l.nhuan === 0) days++;
        else break;
      }
      return days || 30;
    }

    function normalizeAmLichInputs() {
      const ngayEl = document.getElementById('ngay');
      const thangEl = document.getElementById('thang');
      const namEl = document.getElementById('nam');
      if (!ngayEl || !thangEl || !namEl) return null;

      let ngay = parseInt(ngayEl.value);
      let thang = parseInt(thangEl.value);
      let nam = parseInt(namEl.value);

      if (!Number.isFinite(nam) || nam < 1) nam = 1;
      if (!Number.isFinite(thang)) thang = 1;
      thang = Math.min(12, Math.max(1, thang));
      if (!Number.isFinite(ngay)) ngay = 1;
      const maxDay = getLunarMonthDaysNoLeap(thang, nam);
      ngay = Math.min(maxDay, Math.max(1, ngay));

      ngayEl.value = ngay;
      thangEl.value = thang;
      namEl.value = nam;
      return { ngay, thang, nam };
    }
